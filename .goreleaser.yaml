version: 2

builds:
  - id: "gitstatus-binary"
    env:
      - "CGO_ENABLED=0"
    goos:
      - "darwin"
      - "linux"
    goarch:
      - "amd64"
      - "arm64"
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}"

homebrew_casks:
  - name: "gitstatus"
    # Homebrew deprecated `postflight` blocks in favour of `postflight_steps`.
    # GoReleaser's `hooks.post.install` still emits the old stanza, so emit the
    # new one via custom_block until hooks.post.install_steps ships (v2.19,
    # https://github.com/goreleaser/goreleaser/pull/6873). Steps resolve
    # relative paths against staged_path, hence `chdir: "."`.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "gitstatus"], chdir: "."
        end
      end
    repository:
      owner: "Jleagle"
      name: "homebrew-gitstatus"
      token: "{{ .Env.HOMEBREW_GITHUB_TOKEN }}"
      pull_request:
        enabled: false
        draft: false
